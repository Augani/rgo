name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        toolchain: [stable, beta]
        include:
          # Nightly is advisory-only: it catches upcoming toolchain regressions
          # early without blocking merges on a moving target.
          - os: ubuntu-latest
            toolchain: nightly
            experimental: true
          - os: macos-14
            toolchain: nightly
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Record exact Cargo and rustc versions
        run: |
          cargo --version --verbose
          rustc --version --verbose
      - name: Build workspace
        run: cargo build --workspace
      - name: Probe Windows scheduled service in a private Cargo home
        if: matrix.os == 'windows-latest' && matrix.toolchain == 'stable'
        shell: pwsh
        run: ./scripts/verify-windows-service.ps1
      - name: Verify local Windows installer
        if: matrix.os == 'windows-latest' && matrix.toolchain == 'stable'
        shell: pwsh
        run: ./scripts/verify-local-windows-installer.ps1
      - name: Verify packaged source install
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: python3 scripts/verify-source-packages.py
      - name: Verify local Unix installer
        if: matrix.toolchain == 'stable' && (matrix.os == 'ubuntu-latest' || matrix.os == 'macos-14')
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export RGO_INSTALLER_TEST_ZDOTDIR=1; fi
          python3 scripts/verify-local-installer.py
          python3 scripts/verify-local-installer.py --supervised
          if [ "$RUNNER_OS" = "macOS" ]; then python3 scripts/verify-unix-service-installer.py; fi
      - name: Probe nightly build-dir layouts
        if: matrix.toolchain == 'nightly'
        run: python3 scripts/verify-nightly-layout.py
      - name: Test workspace
        timeout-minutes: 8
        run: cargo test --workspace
      - uses: actions/setup-python@v5
        if: matrix.toolchain == 'stable'
        with:
          python-version: '3.11'
      - name: Verify 100-project budget recovery
        if: matrix.toolchain == 'stable'
        timeout-minutes: 8
        run: python scripts/verify-100-project-recovery.py
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Diff check
        run: git diff --check

  source-msrv:
    name: Source build / Rust 1.85 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - name: Build every distributable binary at the declared source minimum
        run: cargo build --workspace --locked

  cargo-boundary:
    name: Cargo 1.90/1.91 activation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build rgo and its compiler wrapper
        run: cargo build --workspace --locked
      - name: Install exact Cargo boundary toolchains
        run: rustup toolchain install 1.90.0 1.91.0 --profile minimal
      - name: Verify rejection, relocation, and undo in private homes
        run: python scripts/verify-cargo-boundary.py

  pinned-nightly-layout:
    name: Pinned nightly layout / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build rgo with the supported source toolchain
        run: cargo build --workspace --locked
      - name: Install exact nightly layout boundary
        run: rustup toolchain install nightly-2026-01-28 --profile minimal
      - name: Verify relocation and fail-closed native deletion in both layouts
        run: python scripts/verify-nightly-layout.py --toolchain nightly-2026-01-28 --without-profile-lock

  btrfs-smoke:
    name: Linux btrfs smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install btrfs tools
        run: sudo apt-get update && sudo apt-get install -y btrfs-progs
      - name: Create filesystem image
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/rgo-btrfs.img"
          truncate -s 2G "$image"
          if ! sudo mkfs.btrfs -f "$image"; then
            echo "btrfs filesystem creation is unavailable on this runner"
            exit 1
          fi
          mountpoint="$RUNNER_TEMP/rgo-btrfs"
          mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint" || {
            echo "loopback mount is unavailable on this runner"
            exit 1
          }
          sudo chown "$USER:$USER" "$mountpoint"
          test "$(findmnt -T "$mountpoint" -no FSTYPE)" = btrfs
          echo "RGO_BTRFS_ROOT=$mountpoint" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run pressure reclaim with its sandbox on btrfs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RGO_BTRFS_ROOT:-}"
          test "$(findmnt -T "$RGO_BTRFS_ROOT" -no FSTYPE)" = btrfs
          RGO_TEST_SANDBOX_PARENT="$RGO_BTRFS_ROOT" cargo test -p rgo-storage --test phase1 pressure_gc_reclaims_idle_unpinned_only_contexts_in_private_home -- --exact
