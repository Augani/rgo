name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      guardian_only:
        description: Run only the existing macOS guardian cases
        type: boolean
        default: true
      guardian_runner:
        description: macOS runtime for the focused audit
        type: choice
        options: [macos-14, macos-15-intel]
        default: macos-14

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.guardian_only && inputs.guardian_runner || 'full' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || !inputs.guardian_only
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        toolchain: [stable, beta]
        include:
          # Nightly is advisory-only: it catches upcoming toolchain regressions
          # early without blocking merges on a moving target.
          - os: ubuntu-latest
            toolchain: nightly
            experimental: true
          - os: macos-14
            toolchain: nightly
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Record exact Cargo and rustc versions
        run: |
          cargo --version --verbose
          rustc --version --verbose
      - name: Build workspace
        run: cargo build --workspace
      - name: Probe Windows scheduled service in a private Cargo home
        if: matrix.os == 'windows-latest' && matrix.toolchain == 'stable'
        shell: pwsh
        run: ./scripts/verify-windows-service.ps1
      - name: Verify local Windows installer
        if: matrix.os == 'windows-latest' && matrix.toolchain == 'stable'
        shell: pwsh
        run: ./scripts/verify-local-windows-installer.ps1
      - name: Verify packaged source install
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: python3 scripts/verify-source-packages.py
      - name: Verify local Unix installer
        if: matrix.toolchain == 'stable' && (matrix.os == 'ubuntu-latest' || matrix.os == 'macos-14')
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then export RGO_INSTALLER_TEST_ZDOTDIR=1; fi
          python3 scripts/verify-local-installer.py
          python3 scripts/verify-local-installer.py --supervised
          if [ "$RUNNER_OS" = "macOS" ]; then python3 scripts/verify-unix-service-installer.py; fi
      - name: Verify Linux user-systemd installer lifecycle
        if: matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          rgo_probe_user="$(id -un)"
          rgo_probe_uid="$(id -u)"
          rgo_probe_changed_linger=false
          cleanup_rgo_user_manager() {
            if [ "$rgo_probe_changed_linger" = true ]; then sudo loginctl disable-linger "$rgo_probe_user"; fi
          }
          trap cleanup_rgo_user_manager EXIT
          # show-user can fail before logind has registered this CI account.
          # Preserve an already enabled linger policy while bootstrapping it.
          if [ ! -e "/var/lib/systemd/linger/$rgo_probe_user" ]; then
            sudo loginctl enable-linger "$rgo_probe_user"
            rgo_probe_changed_linger=true
          fi
          sudo systemctl start "user@$rgo_probe_uid.service"
          export XDG_RUNTIME_DIR="/run/user/$rgo_probe_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          export RGO_PROBE_RESTART_USER_MANAGER=1
          systemctl --user show default.target --property=ActiveState
          python3 scripts/verify-unix-service-installer.py
      - name: Probe nightly build-dir layouts
        if: matrix.toolchain == 'nightly'
        run: python3 scripts/verify-nightly-layout.py
      - name: Test workspace
        timeout-minutes: 8
        run: cargo test --workspace
      - uses: actions/setup-python@v5
        if: matrix.toolchain == 'stable'
        with:
          python-version: '3.11'
      - name: Verify 100-project budget recovery
        if: matrix.toolchain == 'stable'
        timeout-minutes: 8
        run: python scripts/verify-100-project-recovery.py
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: Diff check
        run: git diff --check

  source-msrv:
    if: github.event_name != 'workflow_dispatch' || !inputs.guardian_only
    name: Source build / Rust 1.85 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - name: Build every distributable binary at the declared source minimum
        run: cargo build --workspace --locked

  cargo-boundary:
    if: github.event_name != 'workflow_dispatch' || !inputs.guardian_only
    name: Cargo 1.90/1.91 activation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build rgo and its compiler wrapper
        run: cargo build --workspace --locked
      - name: Install exact Cargo boundary toolchains
        run: rustup toolchain install 1.90.0 1.91.0 --profile minimal
      - name: Verify rejection, relocation, and undo in private homes
        run: python scripts/verify-cargo-boundary.py

  pinned-nightly-layout:
    if: github.event_name != 'workflow_dispatch' || !inputs.guardian_only
    name: Pinned nightly layout / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build rgo with the supported source toolchain
        run: cargo build --workspace --locked
      - name: Install exact nightly layout boundary
        run: rustup toolchain install nightly-2026-01-28 --profile minimal
      - name: Verify relocation and fail-closed native deletion in both layouts
        run: python scripts/verify-nightly-layout.py --toolchain nightly-2026-01-28 --without-profile-lock

  macos-intel-supervisor:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.guardian_only && format('macOS Cargo guardian / {0}', inputs.guardian_runner) || 'macOS Intel Cargo guardian' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.guardian_only && inputs.guardian_runner || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record macOS runtime and architecture
        run: |
          sw_vers
          uname -m
          cargo --version --verbose
      - name: Build every binary before real-Cargo fixtures
        run: cargo build --workspace --locked
      - name: Verify descendant protection, job recovery, and signal handoff
        timeout-minutes: 3
        run: cargo test -p rgo-storage --test macos_coalition --test supervised_interrupt -- --nocapture

  btrfs-smoke:
    if: github.event_name != 'workflow_dispatch' || !inputs.guardian_only
    name: Linux btrfs smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install btrfs tools
        run: sudo apt-get update && sudo apt-get install -y btrfs-progs
      - name: Create filesystem image
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/rgo-btrfs.img"
          truncate -s 2G "$image"
          if ! sudo mkfs.btrfs -f "$image"; then
            echo "btrfs filesystem creation is unavailable on this runner"
            exit 1
          fi
          mountpoint="$RUNNER_TEMP/rgo-btrfs"
          mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint" || {
            echo "loopback mount is unavailable on this runner"
            exit 1
          }
          sudo chown "$USER:$USER" "$mountpoint"
          test "$(findmnt -T "$mountpoint" -no FSTYPE)" = btrfs
          echo "RGO_BTRFS_ROOT=$mountpoint" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run pressure reclaim with its sandbox on btrfs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RGO_BTRFS_ROOT:-}"
          test "$(findmnt -T "$RGO_BTRFS_ROOT" -no FSTYPE)" = btrfs
          RGO_TEST_SANDBOX_PARENT="$RGO_BTRFS_ROOT" cargo test -p rgo-storage --test phase1 pressure_gc_reclaims_idle_unpinned_only_contexts_in_private_home -- --exact
