name: Release

# Versioned release binaries + checksums for every tag. Equivalent automation to
# cargo-dist without the extra tool: each archive always contains `rgo` and
# `rgo-rustc-wrapper` side by side because `rgo setup` requires the wrapper next to the CLI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-aarch64, os: macos-14, target: aarch64-apple-darwin, ext: "" }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, ext: "" }
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p rgo-storage -p rgo-rustc-wrapper
      - name: Verify matched binaries and tag
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          cli_version=$("$bin_dir/rgo${{ matrix.ext }}" --version)
          wrapper_version=$("$bin_dir/rgo-rustc-wrapper${{ matrix.ext }}" --rgo-version)
          version="${cli_version#rgo }"
          [[ "$cli_version" == "rgo $version" ]]
          [[ "$wrapper_version" == "rgo-rustc-wrapper $version protocol "* ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          fi
      - name: Verify Linux glibc baseline
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          python3 scripts/verify-linux-glibc.py --max-glibc 2.35 \
            target/${{ matrix.target }}/release/rgo \
            target/${{ matrix.target }}/release/rgo-rustc-wrapper
      - name: Package archive
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="rgo-${TAG}-${{ matrix.target }}"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"
          bin_dir="target/${{ matrix.target }}/release"
          cp "$bin_dir/rgo${{ matrix.ext }}" "$bin_dir/rgo-rustc-wrapper${{ matrix.ext }}" "$stage/"
          cp README.md doc.md LICENSE-MIT LICENSE-APACHE "$stage/"
          mkdir -p artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -NoProfile -File scripts/package-windows-release.ps1 -Stage "$stage" -Name "$name" -Archive "artifacts/$name.zip"
          else
            tar -C "$RUNNER_TEMP" -czf "artifacts/$name.tar.gz" "$name"
          fi
      - name: Checksum
        shell: bash
        run: |
          cd artifacts
          # Keep leaf asset names: installers match SHA256SUMS entries exactly.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            sha256sum rgo-* > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            shasum -a 256 rgo-* > "SHA256SUMS-${{ matrix.target }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.target }}.txt"
      - name: Attest release bundle
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: artifacts/rgo-${{ github.ref_name }}-${{ matrix.target }}.*
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  bundle:
    name: Verify complete release bundle
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Merge checksums
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt
          cp scripts/install-unix.py dist/rgo-install-unix.py
          cp scripts/install-windows.ps1 dist/rgo-install-windows.ps1
          (cd dist && shasum -a 256 rgo-install-unix.py rgo-install-windows.ps1 >> SHA256SUMS.txt)
          sort -o dist/SHA256SUMS.txt dist/SHA256SUMS.txt
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 6
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Verify Windows ZIP paths
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          top = f"rgo-{os.environ['GITHUB_REF_NAME']}-x86_64-pc-windows-msvc"
          archive = Path('dist') / f'{top}.zip'
          expected = sorted(f'{top}/{name}' for name in (
              'rgo.exe', 'rgo-rustc-wrapper.exe', 'README.md', 'doc.md',
              'LICENSE-MIT', 'LICENSE-APACHE'))
          with ZipFile(archive) as bundle:
              actual = sorted(member.filename for member in bundle.infolist())
          if actual != expected:
              raise SystemExit(f'unexpected Windows ZIP entries: {actual}')
          PY
      - name: Attest Unix installer
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/rgo-install-unix.py
      - name: Attest Windows installer
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/rgo-install-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/') && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "rgo $GITHUB_REF_NAME" --generate-notes --verify-tag
