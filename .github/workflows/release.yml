name: Release

# Versioned release binaries + checksums for every tag. Equivalent automation to
# cargo-dist without the extra tool: each archive always contains `rgo` and
# `rgo-rustc-wrapper` side by side because `rgo setup` requires the wrapper next to the CLI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-aarch64, os: macos-14, target: aarch64-apple-darwin, ext: "" }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, ext: "" }
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p rgo-storage -p rgo-rustc-wrapper
      - name: Verify matched binaries and tag
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          cli_version=$("$bin_dir/rgo${{ matrix.ext }}" --version)
          wrapper_version=$("$bin_dir/rgo-rustc-wrapper${{ matrix.ext }}" --rgo-version)
          version="${cli_version#rgo }"
          [[ "$cli_version" == "rgo $version" ]]
          [[ "$wrapper_version" == "rgo-rustc-wrapper $version protocol "* ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          fi
      - name: Package archive
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="rgo-${TAG}-${{ matrix.target }}"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"
          bin_dir="target/${{ matrix.target }}/release"
          cp "$bin_dir/rgo${{ matrix.ext }}" "$bin_dir/rgo-rustc-wrapper${{ matrix.ext }}" "$stage/"
          cp README.md doc.md LICENSE-MIT LICENSE-APACHE "$stage/"
          mkdir -p artifacts
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$stage' -DestinationPath 'artifacts/$name.zip'"
          else
            tar -C "$RUNNER_TEMP" -czf "artifacts/$name.tar.gz" "$name"
          fi
      - name: Checksum
        shell: bash
        run: |
          cd artifacts
          shasum -a 256 ./* > "SHA256SUMS-${{ matrix.target }}.txt"
          cat "SHA256SUMS-${{ matrix.target }}.txt"
      - name: Attest release bundle
        if: github.event.repository.visibility == 'public' && startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: artifacts/rgo-${{ github.ref_name }}-${{ matrix.target }}.*
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Merge checksums
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt
          cp scripts/install-unix.py dist/rgo-install-unix.py
          cp scripts/install-windows.ps1 dist/rgo-install-windows.ps1
          (cd dist && shasum -a 256 rgo-install-unix.py rgo-install-windows.ps1 >> SHA256SUMS.txt)
          sort -o dist/SHA256SUMS.txt dist/SHA256SUMS.txt
      - name: Attest Unix installer
        uses: actions/attest@v4
        with:
          subject-path: dist/rgo-install-unix.py
      - name: Attest Windows installer
        uses: actions/attest@v4
        with:
          subject-path: dist/rgo-install-windows.ps1
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "rgo ${{ github.ref_name }}" --generate-notes --verify-tag
