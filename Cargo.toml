[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Augani/rgo"
rust-version = "1.85"

[workspace.dependencies]
rgo-core = { path = "crates/rgo-core", version = "=0.1.0" }
rgo-protocol = { path = "crates/rgo-protocol", version = "=0.1.0" }
rgo-testkit = { path = "crates/rgo-testkit" }
rgo-key = { path = "crates/rgo-key", version = "=0.1.0" }
rgo-cas = { path = "crates/rgo-cas", version = "=0.1.0" }
rgo-materialize = { path = "crates/rgo-materialize", version = "=0.1.0" }
rgo-remote = { path = "crates/rgo-remote", version = "=0.1.0" }
rgo-winpipe = { path = "crates/rgo-winpipe", version = "=0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
humantime = "2"
bytesize = "2"
directories = "6"
walkdir = "2"
fs4 = "0.13"
rustix = "1.1"
libc = "0.2"
interprocess = { version = "2.4.4", default-features = false }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
