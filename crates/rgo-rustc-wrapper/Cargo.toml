[package]
name = "rgo-rustc-wrapper"
description = "Minimal rustc wrapper for rgo. Must stay tiny: it runs on every compiler invocation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Deliberately no clap / tokio / sqlite / tracing. Startup time is on the build's critical path.
[dependencies]
anyhow.workspace = true
rgo-protocol.workspace = true
rgo-key.workspace = true
rgo-cas.workspace = true
rgo-materialize.workspace = true
serde.workspace = true
serde_json.workspace = true
fs4.workspace = true

interprocess.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
rgo-winpipe.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
