[package]
name = "rgo-storage"
description = "Bounded, machine-managed Rust build storage. Install once, use cargo normally."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Integration tests use the unpublished workspace-only rgo-testkit.
exclude = ["tests/"]

[[bin]]
name = "rgo"
path = "src/main.rs"

[dependencies]
rgo-core.workspace = true
rgo-protocol.workspace = true
rgo-cas.workspace = true
rgo-materialize.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytesize.workspace = true
humantime.workspace = true
fs4.workspace = true
tempfile.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
rgo-testkit.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
